# Blueprint del piloto Nexora. Este archivo describe recursos, pero no crea
# nada por sí solo: Render sólo lo aplica cuando una persona conecta el repo.
#
# Debe reflejar lo que corre en Render (comprobado el 10-oct-2026): web
# 0.5c-512mb, API 1c-2g y PostgreSQL 0.5c-1g con 5 GB de disco. Si el
# Blueprint se sincroniza con valores menores, Render bajaría los planes
# (reinicio en horario de tienda) e intentaría encoger el disco, cosa que no
# admite. Regla: los cambios de plan se hacen PRIMERO aquí (y en
# tests/cloud-deploy.test.ts, que impide bajar planes por accidente) y después
# en el panel; nunca sólo en el panel. Ver docs/DEPLOY-RENDER.md.
services:
  - type: web
    name: nexora-pos-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.web
    healthCheckPath: /healthz
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 30
    envVars:
      - key: PORT
        value: "10000"
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: nexora-pos-api
          property: hostport
      # Opcional (G8): DSN de Sentry para la web, se lee al compilar. Sin él la
      # web no envía errores a Sentry. Al arrancar, la web añade el host de
      # este DSN a connect-src (deploy/render/render-security-headers.sh); sin
      # él, la CSP no menciona Sentry.
      - key: VITE_SENTRY_DSN
        sync: false

  - type: pserv
    name: nexora-pos-api
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.api
    # Render sólo admite comprobación TCP para servicios privados. La
    # preparación HTTP completa se verifica por la web en /api/health.
    autoDeployTrigger: off
    maxShutdownDelaySeconds: 60
    preDeployCommand: node deploy/render/with-cloud-env.mjs node apps/api/node_modules/prisma/build/index.js migrate deploy --schema apps/api/prisma/schema.prisma
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: nexora-pos-db
          property: connectionString
      - key: WEB_ORIGIN
        # La API recibe la URL pública generada por Render sin fijar un nombre
        # que pudiera cambiar. Al añadir dominio propio, sustituir esta entrada
        # por un value HTTPS explícito; ver docs/DEPLOY-RENDER.md.
        fromService:
          type: web
          name: nexora-pos-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5

databases:
  - name: nexora-pos-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    # Nombre real de la base en Render (no se puede cambiar tras crearla).
    databaseName: fitstore_bfjz
    user: fitstore
    # El disco de PostgreSQL en Render sólo puede crecer: nunca bajar de 5.
    diskSizeGB: 5
    # Apagado como en Render. Activarlo es decisión de la dueña (costo); ver
    # docs/MONITOREO.md para vigilar el uso de disco mientras tanto.
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
