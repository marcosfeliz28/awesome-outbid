name: FitStore checks
on: [push, pull_request]
# M10: el GITHUB_TOKEN de este workflow sólo puede leer el repositorio. Las
# acciones se fijan por SHA (comentario con la versión); Dependabot las
# actualiza (.github/dependabot.yml). N7 (auditoría 04 v2): cada SHA se
# verificó contra el repositorio de la acción con
#   git ls-remote --tags https://github.com/<dueño>/<acción>.git
# y coincide con el tag del comentario (v4.4.0, v4.3.0, v4.4.0, v4.6.2); si se
# cambia uno, repetir la comprobación (el SHA de un tag anotado es el de
# `<tag>^{}`, no el del objeto tag).
permissions:
  contents: read
# 29-oct-2026: un empuje nuevo a la misma rama cancela la ejecución anterior
# (solo cuenta el último SHA). Sin esto, cada empuje de las sesiones apilaba
# una ejecución completa de ~35 min y saturaba los ejecutores.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: fitstore
          POSTGRES_PASSWORD: fitstore_ci
          POSTGRES_DB: fitstore
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fitstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitstore:fitstore_ci@localhost:5434/fitstore
      JWT_SECRET: fitstore-ci-secret-for-isolated-tests-only-2026
      SEED_DEMO_PASSWORD: FitStore-Demo-2026!
      BACKUP_TEST_ADMIN_URL: postgresql://fitstore:fitstore_ci@localhost:5434/postgres
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Respaldo y restauración real (PostgreSQL 17)
        run: |
          set -euo pipefail
          # El runner trae el cliente 16 y pg_dump se niega a respaldar un servidor 17.
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # También para los pasos siguientes (tests/backup-restore.test.ts usa pg_dump del PATH).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          B="$RUNNER_TEMP/backup"
          NEXORA_BACKUP_DIR="$B" node scripts/backup.mjs
          createdb -h localhost -p 5434 -U fitstore restore_check
          RESTORE_DATABASE_URL=postgresql://fitstore:fitstore_ci@localhost:5434/restore_check \
            node scripts/restore.mjs "$B"/nexora-fitstore-*.dump
          q="select table_name||':'||(xpath('/row/c/text()', query_to_xml('select count(*) c from public.'||quote_ident(table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1"
          psql "$DATABASE_URL" -At -c "$q" > "$RUNNER_TEMP/a.txt"
          psql postgresql://fitstore:fitstore_ci@localhost:5434/restore_check -At -c "$q" > "$RUNNER_TEMP/b.txt"
          test -s "$RUNNER_TEMP/a.txt"
          diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
          echo "Tablas restauradas: $(wc -l < "$RUNNER_TEMP/a.txt"), conteos idénticos."
        env:
          PGPASSWORD: fitstore_ci
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fitstore-test-evidence
          path: |
            playwright-report
            test-results
  # Producto multiempresa en vivo (20-nov-2026): API compilada con
  # PRODUCT_TENANCY=required y registro público cerrado sobre PostgreSQL
  # desechable, migrada con el preDeploy real por un dueño SIN superusuario
  # (como nexora-saas-db). Dos empresas ficticias por invitación del operador:
  # ventas, caja, descuento con PIN, anulación, exportación, suspensión,
  # sucursal, permisos y aislamiento A/B; luego humo de navegador.
  # Ver scripts/verify-product.mjs. No toca a `verify` (modo tienda).
  verify-product:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexora_saas_migrator:migrador_ci@localhost:5435/nexora_saas
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Dueño nexora_saas_migrator con LOGIN CREATEROLE, sin SUPERUSER
        env:
          PGPASSWORD: postgres_ci
        run: |
          psql -X -q -v ON_ERROR_STOP=1 -h localhost -p 5435 -U postgres <<'SQL'
          CREATE ROLE nexora_saas_migrator LOGIN CREATEROLE PASSWORD 'migrador_ci';
          CREATE DATABASE nexora_saas OWNER nexora_saas_migrator;
          SQL
      - name: PreDeploy real del producto (chequeo, rol RLS, migraciones)
        run: node deploy/render/producto-predeploy.mjs
      - name: Compilar API y PWA del producto
        run: pnpm build
        env:
          VITE_PRODUCT_TENANCY: required
      - run: pnpm exec playwright install --with-deps chromium
      - name: Flujo de producto en vivo (API + navegador)
        run: node scripts/verify-product.mjs
        env:
          CI: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: verify-product-evidence
          path: |
            playwright-report/product
            test-results
  # A4: construye las imágenes de Render (sin publicarlas) y las arranca como
  # en un despliegue: web antes que la API, migraciones con el preDeployCommand
  # de render.yaml y post-deploy-check.mjs a través de la web.
  render-images:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Construir la imagen de la API (Render, sin publicar)
        run: docker build -f deploy/render/Dockerfile.api -t nexora-pos-api:ci .
      - name: Construir la imagen web (Render, sin publicar)
        run: docker build -f deploy/render/Dockerfile.web -t nexora-pos-web:ci .
      # El producto se reconoce por su blueprint, no por el nombre de la rama:
      # toda rama que salga de producto-nexora usa el arranque multiempresa.
      - name: Arranque como en Render (tienda) o aislado del producto multiempresa
        run: |
          if [ -f render.producto.yaml ]; then
            bash scripts/producto-ci-smoke.sh
          else
            bash deploy/render/ci-smoke.sh
          fi
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - name: Exigir PostgreSQL real para recuperación del instalador
        shell: pwsh
        run: |
          $pgBin = $env:PGBIN
          if (-not $pgBin) {
            $version = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory | Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
            if (-not $version) { throw 'No hay PostgreSQL instalado en el runner Windows.' }
            $pgBin = Join-Path $version.FullName 'bin'
          }
          foreach ($tool in @('initdb.exe', 'pg_ctl.exe', 'psql.exe', 'pg_dump.exe', 'pg_restore.exe')) {
            if (-not (Test-Path -LiteralPath (Join-Path $pgBin $tool) -PathType Leaf)) { throw "Falta $tool en PGBIN." }
          }
          "PGBIN=$pgBin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & (Join-Path $pgBin 'psql.exe') --version
      - run: node -e "if(process.platform!=='win32') process.exit(1)"
      - run: pnpm exec vitest run tests/portabilidad.test.ts --reporter=verbose
      - run: pnpm instalador:validar
      # Entrega el .exe (sin firma de código) como artefacto, solo en empujes a
      # nexora-cloud, claude-pc/* y chatgpt-*/*. Corre en paralelo con verify
      # (~35 min), así que no alarga el total. Sin secretos. Firma pendiente:
      # instalador/README.md, «Compilado en CI y firma de código».
      - name: Instalar NSIS si falta (Chocolatey del runner)
        id: nsis
        if: github.event_name == 'push' && (github.ref == 'refs/heads/nexora-cloud' || startsWith(github.ref, 'refs/heads/claude-pc/') || startsWith(github.ref, 'refs/heads/chatgpt-'))
        shell: pwsh
        run: |
          $nsis = @("${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $nsis) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar NSIS con Chocolatey." }
          }
      - name: Compilar el instalador (sin firma)
        id: exe
        if: steps.nsis.outcome == 'success'
        timeout-minutes: 30
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath instalador/VERSION -Raw).Trim()
          powershell -NoProfile -ExecutionPolicy Bypass -File instalador/build.ps1 -SinInstalarNSIS
          if ($LASTEXITCODE -ne 0) { throw "La compilación del instalador falló ($LASTEXITCODE)." }
          $name = "Nexora-POS-Setup-$version.exe"
          $hash = (Get-FileHash -LiteralPath "instalador/dist/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$name" | Set-Content -LiteralPath "instalador/dist/$name.sha256.txt" -Encoding ascii
          "SHA-256 de ${name}: $hash"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: steps.exe.outcome == 'success'
        with:
          name: Nexora-POS-Setup-${{ steps.exe.outputs.version }}
          path: |
            instalador/dist/Nexora-POS-Setup-${{ steps.exe.outputs.version }}.exe
            instalador/dist/Nexora-POS-Setup-${{ steps.exe.outputs.version }}.exe.sha256.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
