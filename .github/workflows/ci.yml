name: FitStore checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fitstore
          POSTGRES_PASSWORD: fitstore_ci
          POSTGRES_DB: fitstore
        ports: ["5434:5432"]
        options: >-
          --health-cmd "pg_isready -U fitstore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://fitstore:fitstore_ci@localhost:5434/fitstore
      JWT_SECRET: fitstore-ci-secret-for-isolated-tests-only-2026
      SEED_DEMO_PASSWORD: FitStore-Demo-2026!
      BACKUP_TEST_ADMIN_URL: postgresql://fitstore:fitstore_ci@localhost:5434/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - name: Respaldo y restauración real (PostgreSQL 17)
        run: |
          set -euo pipefail
          # El runner trae el cliente 16 y pg_dump se niega a respaldar un servidor 17.
          sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -qq postgresql-client-17
          # También para los pasos siguientes (tests/backup-restore.test.ts usa pg_dump del PATH).
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          pg_dump --version
          B="$RUNNER_TEMP/backup"
          NEXORA_BACKUP_DIR="$B" node scripts/backup.mjs
          createdb -h localhost -p 5434 -U fitstore restore_check
          RESTORE_DATABASE_URL=postgresql://fitstore:fitstore_ci@localhost:5434/restore_check \
            node scripts/restore.mjs "$B"/nexora-fitstore-*.dump
          q="select table_name||':'||(xpath('/row/c/text()', query_to_xml('select count(*) c from public.'||quote_ident(table_name), false, true, '')))[1]::text from information_schema.tables where table_schema='public' and table_type='BASE TABLE' order by 1"
          psql "$DATABASE_URL" -At -c "$q" > "$RUNNER_TEMP/a.txt"
          psql postgresql://fitstore:fitstore_ci@localhost:5434/restore_check -At -c "$q" > "$RUNNER_TEMP/b.txt"
          test -s "$RUNNER_TEMP/a.txt"
          diff "$RUNNER_TEMP/a.txt" "$RUNNER_TEMP/b.txt"
          echo "Tablas restauradas: $(wc -l < "$RUNNER_TEMP/a.txt"), conteos idénticos."
        env:
          PGPASSWORD: fitstore_ci
      - run: pnpm check
      - run: pnpm exec playwright install --with-deps chromium
      - run: node scripts/verify.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fitstore-test-evidence
          path: |
            playwright-report
            test-results
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: node -e "if(process.platform!=='win32') process.exit(1)"
      - run: pnpm exec vitest run tests/portabilidad.test.ts --reporter=verbose
      - run: pnpm instalador:validar
