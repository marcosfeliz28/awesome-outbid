name: Isolated synthetic visual pilot
on:
  push:
    branches: [dot/qa-visual-pilot-f5cb-18nov]
permissions:
  contents: read
jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.19.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @fitstore/web build
      - run: pnpm exec playwright install --with-deps chromium
      - name: Capture synthetic roots only
        run: pnpm exec playwright test --config qa/visual15/playwright.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: synthetic-15areas-f5cb-pilot
          path: qa-evidence
          retention-days: 7
