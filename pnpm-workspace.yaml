packages:
  - apps/*
  - packages/*
storeDir: ../.pnpm-store
verifyDepsBeforeRun: false
overrides:
  effect: "3.20.0"
  deepmerge-ts: ">=8.0.0"
  "js-yaml@>=5.0.0 <=5.4.0": ">=5.4.1"
  "uuid@<11.1.1": ">=11.1.1"
allowBuilds:
  "@nestjs/core": true
  "@prisma/client": true
  "@prisma/engines": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": true
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  esbuild: true
  prisma: true
  "@scarf/scarf": false
