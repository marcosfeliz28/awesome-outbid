# Producto Nexora, infraestructura independiente. NO sincronizar sin revisión
# de Claude y sin aprovisionar el rol de ejecución RLS de la base nueva.
# ANTES del primer preDeployCommand, un administrador de nexora-saas-db debe
# ejecutar scripts/producto-bootstrap.sql y comprobar su SELECT final.
# No ejecutar el script ni este blueprint contra la base de la tienda.
services:
  - type: web
    name: nexora-saas-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.web
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: VITE_PRODUCT_TENANCY
        value: required
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: nexora-saas-api
          property: hostport

  - type: pserv
    name: nexora-saas-api
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.api
    autoDeployTrigger: off
    preDeployCommand: node deploy/render/with-cloud-env.mjs node apps/api/node_modules/prisma/build/index.js migrate deploy --schema apps/api/prisma/schema.prisma
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: PRODUCT_TENANCY
        value: required
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: nexora-saas-db
          property: connectionString
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: nexora-saas-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nexora-saas-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    databaseName: nexora_saas
    user: nexora_saas_migrator
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
