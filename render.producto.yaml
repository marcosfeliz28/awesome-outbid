# Producto Nexora, infraestructura independiente. NO sincronizar sin revisión
# de Claude. El preDeployCommand de la API crea el rol RLS de la base nueva
# (scripts/producto-bootstrap.sql, idempotente, falla si no queda bien) y
# después migra. No ejecutar el script ni este blueprint contra la tienda.
services:
  - type: web
    name: nexora-saas-web
    runtime: docker
    region: virginia
    plan: 0.5c-512mb
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.web
    healthCheckPath: /healthz
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "10000"
      - key: VITE_PRODUCT_TENANCY
        value: required
      - key: API_UPSTREAM
        fromService:
          type: pserv
          name: nexora-saas-api
          property: hostport

  - type: pserv
    name: nexora-saas-api
    runtime: docker
    region: virginia
    plan: 1c-2g
    numInstances: 1
    dockerContext: .
    dockerfilePath: ./deploy/render/Dockerfile.api
    autoDeployTrigger: off
    preDeployCommand: node deploy/render/producto-predeploy.mjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: ENABLE_SWAGGER
        value: "false"
      - key: PRODUCT_TENANCY
        value: required
      # Piloto: registro público cerrado (solo "enabled" lo abre).
      - key: PRODUCT_PUBLIC_REGISTRATION
        value: disabled
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: nexora-saas-db
          property: connectionString
      - key: WEB_ORIGIN
        fromService:
          type: web
          name: nexora-saas-web
          envVarKey: RENDER_EXTERNAL_URL
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: nexora-saas-db
    region: virginia
    plan: 0.5c-1g
    postgresMajorVersion: "17"
    databaseName: nexora_saas
    user: nexora_saas_migrator
    diskSizeGB: 5
    storageAutoscalingEnabled: false
    connectionPool: none
    ipAllowList: []
