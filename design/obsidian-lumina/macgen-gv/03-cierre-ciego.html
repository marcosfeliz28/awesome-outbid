<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>body{font-family:Manrope;background:#05050A;color:#f8f9ff}.mono{font-family:'DM Mono';font-variant-numeric:tabular-nums}.card{background:#121521;border:1px solid #272d3e}</style><title>Cierre ciego · Nexora</title></head><body><main class="max-w-5xl min-h-screen mx-auto p-4 md:p-8"><header><p class="mono text-xs text-emerald-300">CAJA PRINCIPAL · TURNO TARDE · LIZBETH</p><h1 class="text-3xl font-extrabold mt-1">Cerrar caja <span class="text-amber-200">a ciegas</span></h1><p class="text-slate-400 mt-2">Cuenta lo que tienes. El esperado se muestra sólo después de enviar.</p></header><div class="grid md:grid-cols-2 gap-5 mt-7"><section class="card rounded-2xl p-5"><h2 class="font-bold">Efectivo por denominación</h2><div class="grid grid-cols-2 gap-3 mt-4"><label class="text-sm text-slate-400">RD$ 2,000 <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="3"></label><label class="text-sm text-slate-400">RD$ 1,000 <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="8"></label><label class="text-sm text-slate-400">RD$ 500 <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="5"></label><label class="text-sm text-slate-400">RD$ 200 <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="4"></label><label class="text-sm text-slate-400">RD$ 100, 50, 25… <input class="mono mt-1 w-full card rounded-lg p-3 text-white" placeholder="Total contado"></label></div><p class="mono mt-5 text-emerald-300">Efectivo contado: RD$ 14,300.00</p></section><aside class="card rounded-2xl p-5"><h2 class="font-bold">Otros medios contados</h2><div class="space-y-3 mt-4"><label class="text-sm text-slate-400 block">Tarjeta <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="9,830.00"></label><label class="text-sm text-slate-400 block">Transferencias <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="4,150.00"></label><label class="text-sm text-slate-400 block">Dólares US$ <input class="mono mt-1 w-full card rounded-lg p-3 text-white" value="20.00"></label></div><div class="mt-5 p-4 rounded-xl bg-slate-800 text-sm text-slate-300">No ves el esperado ni la diferencia hasta enviar tu conteo.</div><button class="mt-5 w-full min-h-[56px] rounded-2xl bg-emerald-300 text-slate-950 font-extrabold">Enviar conteo para cuadrar</button></aside></div></main></body></html>
