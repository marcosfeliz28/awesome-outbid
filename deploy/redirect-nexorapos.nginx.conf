# Redirección permanente (301) de nexorapos.net a norexos.ai. EJEMPLO: no se
# usa en ningún despliegue hasta que la dueña lo decida (ver
# docs/venta/dominio/DNS_Y_CORREO.md, sección «Redirección 301»).
#
# La opción más simple NO necesita este archivo: una regla de redirección en
# Cloudflare (donde ya está el DNS de nexorapos.net). Este archivo es la
# alternativa si se prefiere un nginx propio, delante de nada más.
#
# Conserva ruta y parámetros: https://nexorapos.net/precios?x=1 ->
# https://norexos.ai/precios?x=1. El TLS lo termina quien esté delante
# (Cloudflare o el proxy del alojamiento); aquí sólo se escucha en HTTP.
server {
    listen 80;
    server_name nexorapos.net www.nexorapos.net;
    server_tokens off;

    # Comprobación de salud para el alojamiento (sin redirigir).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://norexos.ai$request_uri;
    }
}
