<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Estado del servicio · Norexos</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #111827; color: #f9fafb; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
    main { box-sizing: border-box; width: min(100%, 42rem); padding: 2rem; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); }
    p { line-height: 1.6; }
    .card { border: 1px solid #6b7280; border-radius: 1rem; padding: 1.4rem; background: #1f2937; }
    #service-result { font-size: 1.25rem; font-weight: 700; }
    button, a { color: #f9fafb; }
    button { min-height: 44px; padding: .7rem 1rem; border: 2px solid #a5b4fc; background: #312e81; border-radius: .6rem; font: inherit; cursor: pointer; }
    button:focus-visible, a:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
    small { display: block; margin-top: 1.5rem; color: #d1d5db; }
  </style>
  <script src="/estado.js" defer></script>
</head>
<body>
  <main>
    <h1>Estado del servicio</h1>
    <p>Comprueba si Norexos responde desde este dispositivo en este momento.</p>
    <section class="card" aria-label="Resultado de la comprobación">
      <p id="service-result" role="status" aria-live="polite">Comprobando…</p>
      <p id="service-time">Aún no se ha comprobado.</p>
      <button id="check-again" type="button">Comprobar de nuevo</button>
    </section>
    <small>Esta prueba comprueba el sitio y la API desde tu conexión. No muestra el historial de disponibilidad ni el estado de otros dispositivos.</small>
    <p><a href="/">Volver a Norexos</a></p>
  </main>
</body>
</html>
